<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" width="1000" height="1280" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #fff; stroke: #555; stroke-width: 1.5; }
    .field { fill: #fff; stroke: #888; stroke-width: 1.2; }
    .t { fill: #222; }
    .muted { fill: #777; }
    .s { font-size: 13px; }
    .m { font-size: 15px; }
    .b { font-weight: bold; }
    .btn { fill: #fff; stroke: #555; stroke-width: 1.5; }
    .btnp { fill: #555; stroke: #555; }
  </style>

  <rect x="0" y="0" width="1000" height="1280" fill="#fafafa"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="85" fill="#d9d9d9"/>
  <text x="500" y="42" text-anchor="middle" class="t b" font-size="26">FoodSafe Boston</text>
  <text x="385" y="70" class="t m">Search</text>
  <text x="455" y="70" class="t m">311 Complaints</text>
  <text x="590" y="70" class="t m">My favorites</text>

  <!-- Restaurant info -->
  <text x="40" y="120" class="t s">← Back to search</text>
  <text x="40" y="158" class="t b" font-size="24">Growl Growl Hot Pot</text>
  <text x="40" y="182" class="muted m">48 WINTER ST, BOSTON, MA 02111</text>
  <path d="M42 192v5M45 192v5M48 192v5M42 197h6M45 197v9M52 206V192c2 1 2 5 0 7" fill="none" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>
  <text x="62" y="204" class="muted s">Eating &amp; Drinking · Sit-down restaurant.</text>
  <text x="40" y="232" class="t m b">Google Maps</text>
  <line x1="40" y1="236" x2="133" y2="236" stroke="#222"/>
  <text x="145" y="232" class="t m b">Yelp</text>
  <line x1="145" y1="236" x2="178" y2="236" stroke="#222"/>
  <rect x="190" y="215" width="70" height="26" rx="5" class="btn"/>
  <text x="225" y="233" text-anchor="middle" class="t s">☆ Save</text>
  <text x="270" y="233" class="muted s">(adds it to My favorites, shows ★ Saved after)</text>

  <!-- Tabs -->
  <line x1="40" y1="300" x2="960" y2="300" stroke="#bbb"/>
  <rect x="40" y="262" width="120" height="38" rx="6" fill="#fafafa" stroke="#bbb"/>
  <line x1="41" y1="300" x2="159" y2="300" stroke="#fafafa" stroke-width="2"/>
  <text x="100" y="287" text-anchor="middle" class="t m b">Inspections</text>
  <text x="185" y="287" class="muted m">311 Complaints (3)</text>

  <text x="40" y="330" class="muted m">6 inspections on record, newest first.</text>
  <rect x="40" y="342" width="920" height="40" rx="8" class="box"/>
  <text x="60" y="367" class="t m b">▸ What do the labels and icons mean?</text>

  <!-- Inspection 1, opened -->
  <rect x="40" y="394" width="920" height="290" rx="8" class="box"/>
  <text x="60" y="424" class="t m b">▾ Oct 10, 2026</text>
  <rect x="200" y="407" width="50" height="22" rx="11" fill="#999"/>
  <text x="225" y="423" text-anchor="middle" fill="#fff" font-size="12" class="b">Fail</text>
  <text x="270" y="424" class="muted m">3 violations</text>

  <line x1="60" y1="442" x2="940" y2="442" stroke="#ddd"/>
  <text x="60" y="465" class="t m"><tspan class="b">★★</tspan> Food Contact Surfaces Clean</text>
  <text x="60" y="485" class="muted s">Not resolved</text>
  <text x="60" y="503" class="muted s" font-style="italic">Clean the inside of the ice machine. Mold seen on the shield.</text>

  <line x1="60" y1="520" x2="940" y2="520" stroke="#ddd"/>
  <text x="60" y="543" class="t m"><tspan class="b">★</tspan> Floors, walls and ceilings in good repair</text>
  <text x="60" y="563" class="muted s">Resolved</text>
  <text x="60" y="581" class="muted s" font-style="italic">Repair the broken tile under the prep sink.</text>

  <line x1="60" y1="598" x2="940" y2="598" stroke="#ddd"/>
  <text x="60" y="621" class="t m"><tspan class="b">★</tspan> Hand washing sink supplied</text>
  <text x="60" y="641" class="muted s">Not resolved</text>
  <text x="60" y="659" class="muted s" font-style="italic">No paper towels at the hand sink in the kitchen.</text>

  <!-- Inspection 2 and 3, closed -->
  <rect x="40" y="696" width="920" height="50" rx="8" class="box"/>
  <text x="60" y="726" class="t m b">▸ Apr 22, 2026</text>
  <rect x="200" y="709" width="50" height="22" rx="11" fill="#555"/>
  <text x="225" y="725" text-anchor="middle" fill="#fff" font-size="12" class="b">Pass</text>
  <text x="270" y="726" class="muted m">0 violations</text>

  <rect x="40" y="758" width="920" height="50" rx="8" class="box"/>
  <text x="60" y="788" class="t m b">▸ Apr 8, 2026</text>
  <rect x="200" y="771" width="50" height="22" rx="11" fill="#999"/>
  <text x="225" y="787" text-anchor="middle" fill="#fff" font-size="12" class="b">Fail</text>
  <text x="270" y="788" class="muted m">5 violations</text>

  <!-- Reviews -->
  <line x1="40" y1="840" x2="960" y2="840" stroke="#bbb"/>
  <text x="40" y="875" class="t b" font-size="20">Reviews</text>

  <rect x="40" y="890" width="920" height="220" rx="8" class="box"/>
  <text x="60" y="918" class="t m b">Write a review</text>
  <text x="60" y="945" class="muted s">Your name</text>
  <rect x="60" y="952" width="430" height="30" rx="5" class="field"/>
  <text x="70" y="972" class="muted s">Anonymous</text>
  <text x="510" y="945" class="muted s">Rating</text>
  <rect x="510" y="952" width="430" height="30" rx="5" class="field"/>
  <text x="520" y="972" class="t s">★★★★★ Great</text>
  <text x="925" y="972" class="t s">▾</text>
  <text x="60" y="1005" class="muted s">Review</text>
  <rect x="60" y="1012" width="880" height="50" rx="5" class="field"/>
  <text x="70" y="1032" class="muted s">How clean was it? How was the food?</text>
  <rect x="60" y="1072" width="110" height="30" rx="5" class="btnp"/>
  <text x="115" y="1092" text-anchor="middle" fill="#fff" class="s b">Post review</text>

  <text x="40" y="1140" class="muted m">2 reviews</text>

  <rect x="40" y="1152" width="920" height="110" rx="8" class="box"/>
  <text x="60" y="1180" class="t m b">Mei</text>
  <text x="100" y="1180" class="t m">★★★★☆</text>
  <text x="170" y="1180" class="muted s">Oct 12, 2026 (edited)</text>
  <text x="60" y="1205" class="t m">The broth was good and the tables were clean this time.</text>
  <rect x="60" y="1222" width="60" height="28" rx="5" class="btn"/>
  <text x="90" y="1241" text-anchor="middle" class="t s">Edit</text>
  <rect x="128" y="1222" width="70" height="28" rx="5" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
  <text x="163" y="1241" text-anchor="middle" fill="#c62828" class="s">Delete</text>
  <text x="210" y="1241" class="muted s">(only on reviews this browser wrote)</text>
</svg>
