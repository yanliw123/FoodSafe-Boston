<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #fff; stroke: #555; stroke-width: 1.5; }
    .t { fill: #222; }
    .muted { fill: #777; }
    .s { font-size: 13px; }
    .m { font-size: 15px; }
    .b { font-weight: bold; }
    .btn { fill: #fff; stroke: #555; stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="1000" height="1000" fill="#fafafa"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="85" fill="#d9d9d9"/>
  <text x="500" y="42" text-anchor="middle" class="t b" font-size="26">FoodSafe Boston</text>
  <text x="385" y="70" class="t m">Search</text>
  <text x="455" y="70" class="t m">311 Complaints</text>
  <text x="590" y="70" class="t m">My favorites</text>

  <!-- Restaurant info (Yanli's part, unchanged) -->
  <text x="40" y="120" class="t s">← Back to search</text>
  <text x="40" y="158" class="t b" font-size="24">Growl Growl Hot Pot</text>
  <text x="40" y="182" class="muted m">48 WINTER ST, BOSTON, MA 02111</text>
  <text x="40" y="204" class="muted s">Eating &amp; Drinking · Sit-down restaurant.</text>
  <text x="40" y="232" class="t m b">Google Maps</text>
  <text x="145" y="232" class="t m b">Yelp</text>
  <rect x="190" y="215" width="70" height="26" rx="5" class="btn"/>
  <text x="225" y="233" text-anchor="middle" class="t s">☆ Save</text>

  <!-- Tabs -->
  <line x1="40" y1="300" x2="960" y2="300" stroke="#bbb"/>
  <text x="70" y="290" class="muted m">Inspections</text>
  <rect x="170" y="262" width="170" height="38" rx="6" fill="#fafafa" stroke="#bbb"/>
  <line x1="171" y1="300" x2="339" y2="300" stroke="#fafafa" stroke-width="2"/>
  <text x="255" y="287" text-anchor="middle" class="t m b">311 Complaints (3)</text>

  <text x="40" y="330" class="muted m">3 complaints reported at this address since 2024, newest first. Other businesses at the same</text>
  <text x="40" y="350" class="muted m">address share this list.</text>

  <!-- Complaint 1, opened -->
  <rect x="40" y="365" width="920" height="300" rx="8" class="box"/>
  <text x="60" y="395" class="t m b">▾ Oct 19, 2026</text>
  <circle cx="200" cy="390" r="5" fill="#b45309"/>
  <text x="212" y="395" class="t m">Unsanitary food</text>
  <rect x="345" y="378" width="76" height="22" rx="11" fill="#999"/>
  <text x="383" y="394" text-anchor="middle" fill="#fff" font-size="12" class="b">Resolved</text>

  <text x="60" y="430" class="muted s">Type</text>
  <text x="200" y="430" class="t s">Unsanitary food</text>
  <text x="60" y="455" class="muted s">Reported</text>
  <text x="200" y="455" class="t s">Oct 19, 2026</text>
  <text x="60" y="480" class="muted s">Address</text>
  <text x="200" y="480" class="t s">48 Winter St, 02111</text>
  <text x="60" y="505" class="muted s">Businesses here</text>
  <text x="200" y="505" class="t s">Growl Growl Hot Pot, Tasty Burger 6</text>
  <text x="200" y="523" class="muted" font-size="12">Boston 311 does not record the business name. We matched it by location.</text>
  <text x="60" y="550" class="muted s">Neighborhood</text>
  <text x="200" y="550" class="t s">Downtown / Financial District</text>
  <text x="60" y="575" class="muted s">Filed by</text>
  <text x="200" y="575" class="t s">Boston 311, case 101006714648</text>
  <text x="60" y="600" class="muted s">City response</text>
  <text x="200" y="600" class="t s">I responded to the location. A full sanitary inspection along with a foodborne</text>
  <text x="200" y="618" class="t s">illness investigation were completed, see reports for more details.</text>

  <!-- Complaint 2 and 3, closed -->
  <rect x="40" y="677" width="920" height="50" rx="8" class="box"/>
  <text x="60" y="707" class="t m b">▸ Jul 7, 2026</text>
  <circle cx="200" cy="702" r="5" fill="#1565c0"/>
  <text x="212" y="707" class="t m">Food alert</text>
  <rect x="300" y="690" width="76" height="22" rx="11" fill="#999"/>
  <text x="338" y="706" text-anchor="middle" fill="#fff" font-size="12" class="b">Resolved</text>

  <rect x="40" y="739" width="920" height="50" rx="8" class="box"/>
  <text x="60" y="769" class="t m b">▸ Jan 2, 2026</text>
  <circle cx="200" cy="764" r="5" fill="#c62828"/>
  <text x="212" y="769" class="t m">Unsanitary establishment</text>
  <rect x="400" y="752" width="76" height="22" rx="11" fill="#999"/>
  <text x="438" y="768" text-anchor="middle" fill="#fff" font-size="12" class="b">Resolved</text>

  <text x="40" y="822" class="t m">File a complaint about this restaurant</text>
  <line x1="40" y1="826" x2="303" y2="826" stroke="#222"/>
  <text x="315" y="822" class="muted s">(opens the complaints page with the name and address filled in)</text>

  <!-- Reviews (Yanli's part, unchanged) -->
  <rect x="40" y="860" width="920" height="110" rx="8" fill="#eee" stroke="#bbb" stroke-dasharray="6 4"/>
  <text x="500" y="920" text-anchor="middle" class="muted m">Reviews section (same as before)</text>
</svg>
