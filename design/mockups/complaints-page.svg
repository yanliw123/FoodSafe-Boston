<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #fff; stroke: #555; stroke-width: 1.5; }
    .field { fill: #fff; stroke: #888; stroke-width: 1.2; }
    .t { fill: #222; }
    .muted { fill: #777; }
    .s { font-size: 13px; }
    .m { font-size: 15px; }
    .b { font-weight: bold; }
    .btn { fill: #fff; stroke: #555; stroke-width: 1.5; }
    .btnp { fill: #555; stroke: #555; }
    .road { stroke: #cfcfcf; stroke-width: 6; fill: none; }
  </style>

  <rect x="0" y="0" width="1000" height="1200" fill="#fafafa"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="110" fill="#d9d9d9"/>
  <text x="500" y="45" text-anchor="middle" class="t b" font-size="26">FoodSafe Boston</text>
  <text x="500" y="70" text-anchor="middle" class="t m">See what diners reported between inspections.</text>
  <text x="385" y="96" class="t m">Search</text>
  <text x="455" y="96" class="t m b">311 Complaints</text>
  <line x1="455" y1="100" x2="566" y2="100" stroke="#222" stroke-width="1.5"/>
  <text x="590" y="96" class="t m">My favorites</text>

  <!-- Intro -->
  <text x="40" y="140" class="muted m">Food safety complaints residents sent to Boston 311 since 2024, plus the ones diners filed here.</text>
  <text x="40" y="160" class="muted m">Search a street, neighborhood or business, then click a dot or a complaint to see the details.</text>

  <!-- Filter form -->
  <rect x="40" y="175" width="920" height="130" rx="8" class="box"/>
  <text x="60" y="200" class="muted s">Street, neighborhood or business</text>
  <rect x="60" y="207" width="280" height="30" rx="5" class="field"/>
  <text x="70" y="227" class="muted s">e.g. Tremont St, Subway</text>
  <text x="360" y="200" class="muted s">Neighborhood</text>
  <rect x="360" y="207" width="180" height="30" rx="5" class="field"/>
  <text x="370" y="227" class="t s">Any</text>
  <text x="525" y="227" class="t s">▾</text>
  <text x="560" y="200" class="muted s">Type</text>
  <rect x="560" y="207" width="180" height="30" rx="5" class="field"/>
  <text x="570" y="227" class="t s">Any</text>
  <text x="725" y="227" class="t s">▾</text>
  <text x="760" y="200" class="muted s">Status</text>
  <rect x="760" y="207" width="180" height="30" rx="5" class="field"/>
  <text x="770" y="227" class="t s">Any</text>
  <text x="925" y="227" class="t s">▾</text>
  <text x="60" y="260" class="muted s">From</text>
  <rect x="60" y="267" width="180" height="30" rx="5" class="field"/>
  <text x="70" y="287" class="muted s">mm/dd/yyyy</text>
  <text x="260" y="260" class="muted s">To</text>
  <rect x="260" y="267" width="180" height="30" rx="5" class="field"/>
  <text x="270" y="287" class="muted s">mm/dd/yyyy</text>
  <rect x="460" y="267" width="90" height="30" rx="5" class="btnp"/>
  <text x="505" y="287" text-anchor="middle" fill="#fff" class="s b">Search</text>
  <rect x="560" y="267" width="80" height="30" rx="5" class="btn"/>
  <text x="600" y="287" text-anchor="middle" class="t s">Clear</text>

  <!-- Count by type -->
  <rect x="40" y="320" width="221" height="50" rx="8" class="box"/>
  <circle cx="60" cy="345" r="6" fill="#c62828"/>
  <text x="74" y="350" class="t s">Unsanitary establishment</text>
  <text x="245" y="350" text-anchor="end" class="t m b">60</text>
  <rect x="273" y="320" width="221" height="50" rx="8" class="box"/>
  <circle cx="293" cy="345" r="6" fill="#b45309"/>
  <text x="307" y="350" class="t s">Unsanitary food</text>
  <text x="478" y="350" text-anchor="end" class="t m b">29</text>
  <rect x="506" y="320" width="221" height="50" rx="8" class="box"/>
  <circle cx="526" cy="345" r="6" fill="#6a4c93"/>
  <text x="540" y="350" class="t s">Employee hygiene</text>
  <text x="711" y="350" text-anchor="end" class="t m b">0</text>
  <rect x="739" y="320" width="221" height="50" rx="8" class="box"/>
  <circle cx="759" cy="345" r="6" fill="#1565c0"/>
  <text x="773" y="350" class="t s">Food alert</text>
  <text x="944" y="350" text-anchor="end" class="t m b">31</text>

  <text x="40" y="395" class="muted s">Solid dots are open complaints, faded ones are closed.</text>

  <!-- Map -->
  <rect x="40" y="405" width="920" height="330" rx="8" fill="#eef2f0" stroke="#555" stroke-width="1.5"/>
  <path class="road" d="M40 520 C 250 500, 450 560, 960 530"/>
  <path class="road" d="M300 405 C 320 520, 280 640, 330 735"/>
  <path class="road" d="M620 405 C 600 500, 680 620, 640 735"/>
  <path class="road" d="M40 660 C 300 640, 600 690, 960 650"/>
  <path d="M800 405 C 760 480, 860 560, 960 600 L 960 405 Z" fill="#d6e4f0"/>
  <rect x="55" y="420" width="28" height="56" rx="4" class="box"/>
  <text x="69" y="442" text-anchor="middle" class="t m b">+</text>
  <line x1="55" y1="448" x2="83" y2="448" stroke="#555"/>
  <text x="69" y="468" text-anchor="middle" class="t m b">−</text>
  <g>
    <circle cx="210" cy="470" r="7" fill="#c62828"/>
    <circle cx="380" cy="530" r="7" fill="#c62828" fill-opacity="0.35"/>
    <circle cx="420" cy="590" r="7" fill="#b45309"/>
    <circle cx="470" cy="500" r="7" fill="#1565c0" fill-opacity="0.35"/>
    <circle cx="520" cy="640" r="7" fill="#c62828"/>
    <circle cx="560" cy="560" r="7" fill="#b45309" fill-opacity="0.35"/>
    <circle cx="610" cy="520" r="7" fill="#c62828" fill-opacity="0.35"/>
    <circle cx="660" cy="600" r="7" fill="#1565c0"/>
    <circle cx="700" cy="680" r="7" fill="#c62828" fill-opacity="0.35"/>
    <circle cx="350" cy="680" r="7" fill="#6a4c93" fill-opacity="0.35"/>
    <circle cx="250" cy="610" r="7" fill="#c62828"/>
    <circle cx="740" cy="540" r="7" fill="#b45309"/>
  </g>
  <!-- Tooltip on one dot -->
  <rect x="225" y="430" width="380" height="28" rx="4" fill="#fff" stroke="#999"/>
  <text x="235" y="449" class="t s">210-218 Brighton Ave · At this address: Burger King · Food alert</text>
  <text x="950" y="728" text-anchor="end" class="muted" font-size="11">Leaflet | © OpenStreetMap contributors</text>

  <text x="40" y="765" class="muted m">120 complaints found</text>

  <!-- Card 1 -->
  <rect x="40" y="780" width="920" height="110" rx="8" class="box"/>
  <text x="60" y="808" class="t b" font-size="18">210-218 Brighton Ave</text>
  <rect x="870" y="792" width="70" height="24" rx="12" fill="#999"/>
  <text x="905" y="809" text-anchor="middle" fill="#fff" class="s b">Noted</text>
  <text x="60" y="832" class="t m">At this address: Burger King</text>
  <circle cx="66" cy="851" r="5" fill="#1565c0"/>
  <text x="78" y="856" class="muted m">Food alert · Reported Oct 13, 2026 · Allston / Brighton</text>
  <rect x="60" y="864" width="70" height="22" rx="4" class="btn"/>
  <text x="95" y="880" text-anchor="middle" class="t s">Details</text>
  <rect x="140" y="864" width="100" height="22" rx="4" class="btn"/>
  <text x="190" y="880" text-anchor="middle" class="t s">Show on map</text>

  <!-- Card 2 -->
  <rect x="40" y="902" width="920" height="110" rx="8" class="box"/>
  <text x="60" y="930" class="t b" font-size="18">500 Boylston St</text>
  <rect x="870" y="914" width="70" height="24" rx="12" fill="#555"/>
  <text x="905" y="931" text-anchor="middle" fill="#fff" class="s b">Open</text>
  <text x="60" y="954" class="t m">5 food businesses at this address</text>
  <circle cx="66" cy="973" r="5" fill="#b45309"/>
  <text x="78" y="978" class="muted m">Unsanitary food · Reported Oct 9, 2026 · Back Bay</text>
  <rect x="60" y="986" width="70" height="22" rx="4" class="btn"/>
  <text x="95" y="1002" text-anchor="middle" class="t s">Details</text>
  <rect x="140" y="986" width="100" height="22" rx="4" class="btn"/>
  <text x="190" y="1002" text-anchor="middle" class="t s">Show on map</text>

  <!-- Card 3: no business found -->
  <rect x="40" y="1024" width="920" height="90" rx="8" class="box"/>
  <text x="60" y="1052" class="t b" font-size="18">25 Lovell St</text>
  <rect x="870" y="1036" width="70" height="24" rx="12" fill="#555"/>
  <text x="905" y="1053" text-anchor="middle" fill="#fff" class="s b">Open</text>
  <circle cx="66" cy="1071" r="5" fill="#c62828"/>
  <text x="78" y="1076" class="muted m">Unsanitary establishment · Reported Oct 2, 2026 · East Boston</text>
  <rect x="60" y="1084" width="70" height="22" rx="4" class="btn"/>
  <text x="95" y="1100" text-anchor="middle" class="t s">Details</text>
  <rect x="140" y="1084" width="100" height="22" rx="4" class="btn"/>
  <text x="190" y="1100" text-anchor="middle" class="t s">Show on map</text>

  <!-- Pager -->
  <rect x="345" y="1140" width="90" height="30" rx="5" class="btn"/>
  <text x="390" y="1160" text-anchor="middle" class="t s">Previous</text>
  <text x="500" y="1160" text-anchor="middle" class="t s">Page 1 of 6</text>
  <rect x="565" y="1140" width="90" height="30" rx="5" class="btn"/>
  <text x="610" y="1160" text-anchor="middle" class="t s">Next</text>
</svg>
